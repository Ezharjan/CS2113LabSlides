# Slide decks listed on index.html, in the order shown.
#
# Adding a new deck
#   1. Put the PDF in this folder, e.g. "Lab 7 - slides.pdf".
#   2. Run:  python build.py --add
#      This appends a starter entry below for every PDF that is not listed yet
#      and rebuilds index.html. Check the new entry, adjust it, then run:
#            python build.py
#   (Or copy one of the [[deck]] blocks below by hand and run `python build.py`.)
#
# Fields
#   id        short name used in links, e.g. index.html#lab7 (letters, digits, -)
#   group     list heading the deck appears under (default "Labs")
#   number    optional; shown as 01, 02, ... and used for the "Lab 7" label
#   label     optional; overrides the small label above the title
#   title     deck title
#   subtitle  optional one-line description
#   date      optional, YYYY-MM-DD
#   file      PDF path, relative to this folder
#   default   optional; set to true to open the page on this deck
#             (otherwise it opens on the last deck of the first group)

